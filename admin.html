<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛博工牌</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0D0E12; color: #F3F4F6; font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }

  .topbar {
    height: 64px; padding: 0 32px; background: #101218; border-bottom: 1px solid #222530;
    display: flex; align-items: center; gap: 24px; flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 800; letter-spacing: 0.3px; }
  .brand-ico {
    width: 24px; height: 22px; border-radius: 6px; border: 1.8px solid #C8FF3D;
    display: flex; align-items: center; justify-content: center; gap: 3px;
  }
  .brand-ico i { width: 4px; height: 4px; border-radius: 50%; background: #C8FF3D; display: block; }
  .brand em { font-style: normal; color: #C8FF3D; }

  .tabs { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: #171A22; border: 1px solid #252936; }
  .tab {
    padding: 6px 16px; border-radius: 7px; border: 0; background: transparent; color: #A6ADBD;
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .tab.on { background: #C8FF3D; color: #0D0E12; font-weight: 700; }

  .spacer { flex: 1; }
  .pair-bar { display: none; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 9px; background: #1B2019; border: 1px solid #C8FF3D; font-size: 12.5px; }
  .pair-bar.show { display: flex; }
  .pair-btn { padding: 4px 10px; border-radius: 6px; border: 0; background: #C8FF3D; color: #0D0E12; font-size: 12px; font-weight: 700; cursor: pointer; }
  .pair-deny { padding: 4px 8px; border-radius: 6px; border: 1px solid #353B4B; background: transparent; color: #A6ADBD; font-size: 12px; cursor: pointer; }

  .sync-state { font-size: 12.5px; color: #6E7485; white-space: nowrap; }
  .sync-state.dirty { color: #C8FF3D; }
  .sync-btn {
    padding: 8px 18px; border-radius: 9px; border: 0; background: #C8FF3D; color: #0D0E12;
    font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .sync-btn:disabled { opacity: 0.6; cursor: wait; }

  .workspace {
    flex: 1; display: grid; grid-template-columns: 344px minmax(0, 1fr); gap: 36px;
    padding: 24px 32px; overflow: hidden; max-width: 1400px; width: 100%; margin: 0 auto;
  }

  /* Left: pure 1:1 device preview shell (zero remote controls) */
  .preview-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .pv-switch {
    width: 320px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    padding: 4px; border-radius: 11px; background: #14161D; border: 1px solid #222530;
  }
  .pv-switch button {
    padding: 7px 0; border-radius: 8px; border: 0; background: transparent; color: #8B91A1;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .pv-switch button.on { background: #C8FF3D; color: #0D0E12; }

  .shell {
    width: 320px; padding: 18px 16px 20px; border-radius: 36px;
    background: linear-gradient(165deg, #252934, #14161D); border: 1.5px solid #353B4B;
    box-shadow: 0 32px 64px -24px #000; display: flex; flex-direction: column; align-items: center;
  }
  .lanyard { width: 56px; height: 9px; border-radius: 99px; background: #0D0E12; border: 1.5px solid #434959; margin-bottom: 14px; }
  .screen-wrap { width: 288px; height: 384px; border-radius: 36px; overflow: hidden; background: #000; box-shadow: 0 0 0 2px #090A0E; }
  .screen {
    width: 240px; height: 320px; border-radius: 30px; transform: scale(1.2); transform-origin: 0 0;
    position: relative; overflow: hidden; font-family: "Hiragino Sans GB", "Heiti SC", sans-serif;
  }

  /* Right editor panels (CRAP minimal hierarchy) */
  .editor-col { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding-right: 4px; }
  .card { padding: 18px 22px; border-radius: 16px; background: #14161D; border: 1px solid #222530; flex-shrink: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .card-head h2 { margin: 0; font-size: 16px; font-weight: 700; color: #F3F4F6; white-space: nowrap; flex-shrink: 0; }
  .card-meta { font-family: Menlo, monospace; font-size: 12px; color: #6E7485; white-space: nowrap; }

  .seg { display: inline-flex; padding: 3px; border-radius: 9px; background: #1B1E28; border: 1px solid #262A36; gap: 3px; }
  .seg button {
    padding: 5px 14px; border: 0; border-radius: 6px; background: transparent; color: #8B91A1;
    font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .seg button.on { background: #F3F4F6; color: #0D0E12; }
  .seg button.on-lime { background: #C8FF3D; color: #0D0E12; }

  /* Style grid */
  .style-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .style-btn {
    padding: 12px 11px 10px; border-radius: 11px; border: 1.5px solid #252936; background: #181A22;
    cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 10px;
  }
  .style-btn.on { border-color: #C8FF3D; background: #1B2019; }
  .style-thumb {
    height: 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);
    padding: 4px 6px; display: flex; align-items: center; justify-content: space-between;
  }
  .style-name { font-size: 13px; font-weight: 700; color: #D1D5E0; white-space: nowrap; }
  .style-btn.on .style-name { color: #FFFFFF; }

  .pal-row { margin-top: 14px; padding-top: 14px; border-top: 1px solid #1E212B; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pal-lbl { font-size: 12.5px; color: #8B91A1; margin-right: 4px; }
  .pal-btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 9px;
    border: 1.5px solid #252936; background: #181A22; color: #C5CBD9; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .pal-btn.on { border-color: #C8FF3D; background: #1B2019; color: #FFFFFF; }
  .swatch { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); flex-shrink: 0; }

  /* Avatar grid */
  .av-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 9px; }
  .px-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .av-btn {
    padding: 7px 5px; border-radius: 11px; border: 1.5px solid #252936; background: #181A22;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .av-btn.on { border-color: #C8FF3D; background: #1B2019; }
  .av-stage {
    width: 100%; height: 74px; border-radius: 8px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
  }
  .av-stage img { width: 68px; height: 68px; object-fit: contain; display: block; }
  .av-name { font-size: 11.5px; font-weight: 600; color: #A6ADBD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .av-btn.on .av-name { color: #FFFFFF; }

  .upload-row { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 14px; align-items: stretch; }
  .upload-prev {
    height: 100px; border-radius: 10px; border: 1.5px solid #2C3140;
    background: repeating-conic-gradient(#1B1E28 0 25%, #14161D 0 50%) 0 0 / 12px 12px;
    display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
  }
  .upload-prev img { width: 88px; height: 88px; object-fit: contain; display: block; }
  .dropzone {
    border-radius: 10px; border: 1.5px dashed #323747; background: #171A23; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer;
  }
  .dropzone.drag { border-color: #C8FF3D; background: #1B2019; }
  .btn-primary { padding: 8px 16px; border-radius: 9px; border: 0; background: #C8FF3D; color: #0D0E12; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-ghost { padding: 6px 12px; border-radius: 8px; border: 1px solid #2E3342; background: #1B1E28; color: #F3F4F6; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  /* Form grid */
  .form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.span2 { grid-column: span 2; }
  .field.span3 { grid-column: span 3; }
  .field label { font-size: 12px; color: #8B91A1; display: flex; justify-content: space-between; }
  .field label span { font-family: Menlo, monospace; font-size: 11px; color: #5E6475; }
  .field input, .field select {
    height: 38px; padding: 0 11px; border-radius: 9px; border: 1px solid #262A36;
    background: #181B24; color: #F3F4F6; font-size: 13.5px; outline: none; width: 100%;
  }
  .field input:focus, .field select:focus { border-color: #C8FF3D; }

  .pill-row { margin-top: 14px; padding-top: 14px; border-top: 1px solid #1E212B; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px;
    border: 1.5px solid #252936; background: #181A22; color: #C5CBD9; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .chip.on { border-color: #C8FF3D; background: #1B2019; color: #FFFFFF; }
  .chip-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* QR & Memo rows */
  .qr-list, .memo-list { display: flex; flex-direction: column; gap: 8px; }
  .qr-row {
    padding: 8px 12px; border-radius: 10px; border: 1.5px solid #252936; background: #181A22;
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .qr-row.on { border-color: #C8FF3D; background: #1B2019; }
  .qr-badge { width: 28px; height: 28px; border-radius: 7px; color: #FFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .qr-row select { height: 30px; padding: 0 6px; border-radius: 7px; border: 1px solid #2A2F3D; background: #14161D; font-size: 12.5px; width: 92px; flex-shrink: 0; }
  .qr-row input { height: 30px; padding: 0 8px; border-radius: 7px; border: 1px solid #2A2F3D; background: #14161D; font-size: 12.5px; flex: 1; min-width: 0; }
  .qr-del, .memo-del { border: 0; background: transparent; color: #6E7485; font-size: 15px; cursor: pointer; padding: 2px 6px; }
  .qr-del:hover, .memo-del:hover { color: #FF5A5A; }
  .add-dashed {
    height: 42px; border-radius: 10px; border: 1.5px dashed #323747; background: #171A23;
    color: #C5CBD9; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
  }
  .add-dashed:hover { border-color: #C8FF3D; color: #FFF; }

  .memo-add-bar { display: flex; gap: 8px; margin-bottom: 10px; }
  .memo-add-bar input { flex: 1; height: 36px; padding: 0 11px; border-radius: 9px; border: 1px solid #262A36; background: #181B24; font-size: 13px; outline: none; }
  .memo-add-bar input:focus { border-color: #C8FF3D; }
  .memo-row {
    height: 42px; padding: 0 10px; border-radius: 10px; background: #181B24; border: 1px solid #222530;
    display: flex; align-items: center; gap: 9px;
  }
  .memo-row.focus { border-color: #2F3646; }
  .memo-chk {
    width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #4A5062; background: transparent;
    color: #0D0E12; font-size: 11px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0;
  }
  .memo-chk.done { border-color: #C8FF3D; background: #C8FF3D; }
  .memo-txt { flex: 1; font-size: 13.5px; color: #F3F4F6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .memo-txt.done { color: #636A7B; text-decoration: line-through; }
  .memo-star { border: 0; background: transparent; color: #565D70; font-size: 15px; cursor: pointer; padding: 0 4px; }
  .memo-star.on { color: #F04E23; }
  .memo-star.full { color: #2C3140; cursor: not-allowed; }
  .memo-mv { border: 0; background: transparent; color: #4B5163; font-size: 12px; cursor: pointer; padding: 0 2px; }
  .memo-mv:hover { color: #C8FF3D; }

  .toast {
    position: fixed; right: 24px; bottom: 24px; padding: 10px 16px; border-radius: 10px;
    background: #1B2019; border: 1px solid #C8FF3D; color: #F3F4F6; font-size: 13px; font-weight: 600;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: #261616; border-color: #FF5A5A; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-ico" aria-hidden="true"><i></i><i></i></div>
      <span>赛博<em>工牌</em></span>
    </div>
    <nav class="tabs">
      <button type="button" class="tab on" data-tab="badge">工牌</button>
      <button type="button" class="tab" data-tab="sub">名片与便签</button>
    </nav>
    <div class="spacer"></div>
    <div id="pairBar" class="pair-bar">
      <span id="pairText"></span>
      <button type="button" id="pairApprove" class="pair-btn">允许配对</button>
      <button type="button" id="pairDeny" class="pair-deny">忽略</button>
    </div>
    <span id="syncState" class="sync-state">已同步</span>
    <button type="button" id="syncBtn" class="sync-btn">同步到工牌</button>
  </header>

  <main class="workspace">
    <!-- Left: pure 1:1 device screen preview -->
    <aside class="preview-col">
      <div id="pvSwitch" class="pv-switch hidden">
        <button type="button" class="on" data-pv="qr">名片码</button>
        <button type="button" data-pv="memo">便签</button>
      </div>
      <div class="shell">
        <div class="lanyard" aria-hidden="true"></div>
        <div class="screen-wrap">
          <div id="screen" class="screen"></div>
        </div>
      </div>
    </aside>

    <!-- Right: Badge Page -->
    <div id="panelBadge" class="editor-col">
      <section class="card">
        <div class="card-head"><h2>风格</h2></div>
        <div id="styleGrid" class="style-grid"></div>
        <div id="palRow" class="pal-row"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>形象</h2>
          <div class="seg">
            <button type="button" id="avTabPreset" class="on">默认</button>
            <button type="button" id="avTabUpload">自定义</button>
          </div>
        </div>
        <div id="avPresetBox"></div>
        <div id="avUploadBox" class="upload-row hidden">
          <div class="upload-prev"><img id="uploadPrevImg" alt="预览"></div>
          <div id="photoDrop" class="dropzone">
            <span id="photoDropText" style="font-size:13.5px;font-weight:600;color:#C5CBD9">拖入图片或点击上传</span>
            <button type="button" id="pickPhotoBtn" class="btn-primary">选择图片</button>
            <input id="photoFile" type="file" accept="image/*" class="hidden">
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>资料</h2></div>
        <div class="form-grid">
          <div class="field">
            <label>姓名 <span id="cntName"></span></label>
            <input id="inName" maxlength="12" placeholder="姓名">
          </div>
          <div class="field">
            <label>花名 <span id="cntHandle"></span></label>
            <input id="inHandle" maxlength="10" placeholder="albis">
          </div>
          <div class="field">
            <label>身份 <span id="cntTitle"></span></label>
            <input id="inTitle" maxlength="12" placeholder="产品经理">
          </div>
          <div class="field">
            <label>MBTI</label>
            <select id="inMbti"></select>
          </div>
          <div class="field span3">
            <label>宣言 <span id="cntTagline"></span></label>
            <input id="inTagline" maxlength="18" placeholder="把一件事做到极致">
          </div>
          <div id="fieldEmp" class="field">
            <label>工号</label>
            <input id="inEmp" maxlength="6" placeholder="选填">
          </div>
          <div id="fieldPassTag" class="field hidden">
            <label>顶标</label>
            <input id="inPassTag" maxlength="12" placeholder="CREATOR PASS">
          </div>
        </div>
        <div id="statusMoodRow" class="pill-row"></div>
      </section>
    </div>

    <!-- Right: QR & Memo Page -->
    <div id="panelSub" class="editor-col hidden">
      <section class="card" style="padding:14px 22px">
        <div class="card-head" style="margin-bottom:0">
          <h2>页面样式</h2>
          <div class="seg">
            <button type="button" id="sceneWork" class="on-lime">职场简约</button>
            <button type="button" id="sceneStu">手账潮玩</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>名片码</h2>
          <div class="seg">
            <button type="button" id="qrRound" class="on">圆角</button>
            <button type="button" id="qrSharp">标准</button>
          </div>
        </div>
        <div id="qrList" class="qr-list"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button type="button" id="uploadQrBtn" class="add-dashed"><span style="color:#C8FF3D;font-size:16px">+</span> 上传二维码图片</button>
          <button type="button" id="addQrManual" class="btn-ghost">+ 粘贴链接</button>
          <input id="qrFile" type="file" accept="image/*" class="hidden">
        </div>
      </section>

      <section class="card" style="flex:1;display:flex;flex-direction:column">
        <div class="card-head">
          <div style="display:flex;align-items:baseline;gap:10px">
            <h2>待办便签</h2>
            <span id="memoMeta" class="card-meta">0/10 · ★ 0/3</span>
          </div>
        </div>
        <div class="memo-add-bar">
          <input id="memoInput" maxlength="40" placeholder="新增一条待办，回车添加">
          <button type="button" id="memoAddBtn" class="btn-ghost">+ 添加</button>
        </div>
        <div id="memoList" class="memo-list"></div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>

<script>
// ---- Compact Pure-JS ISO/IEC 18004 QR Encoder (V1..V6, ECC-M, Byte mode; mirrors firmware cb_qrcode.c) ----
const QR = (() => {
  const VER = [
    { data: 16, ec: 10, blk: 1, al: 0 },
    { data: 28, ec: 16, blk: 1, al: 18 },
    { data: 44, ec: 26, blk: 1, al: 22 },
    { data: 64, ec: 18, blk: 2, al: 26 },
    { data: 86, ec: 24, blk: 2, al: 30 },
    { data: 108, ec: 16, blk: 4, al: 34 },
  ]
  const FMT = [0x5412, 0x5125, 0x5E7C, 0x5B4B, 0x45F9, 0x40CE, 0x4F97, 0x4AA0]
  const gfMul = (a, b) => {
    let r = 0
    for (let i = 0; i < 8; i++) {
      if (b & 1) r ^= a
      const hi = a & 0x80
      a = (a << 1) & 0xFF
      if (hi) a ^= 0x1D
      b >>= 1
    }
    return r
  }
  const rs = (data, ecLen) => {
    const gen = new Uint8Array(ecLen)
    gen[ecLen - 1] = 1
    let root = 1
    for (let i = 0; i < ecLen; i++) {
      for (let j = 0; j < ecLen; j++) gen[j] = gfMul(gen[j], root) ^ (j + 1 < ecLen ? gen[j + 1] : 0)
      root = gfMul(root, 2)
    }
    const ec = new Uint8Array(ecLen)
    for (let i = 0; i < data.length; i++) {
      const f = data[i] ^ ec[0]
      ec.copyWithin(0, 1)
      ec[ecLen - 1] = 0
      for (let j = 0; j < ecLen; j++) ec[j] ^= gfMul(gen[j], f)
    }
    return ec
  }
  function encode(text) {
    const bytes = new TextEncoder().encode(text)
    if (!bytes.length || bytes.length > 106) return null
    let ver = 0
    for (let v = 1; v <= 6; v++) { if (bytes.length <= VER[v - 1].data - 2) { ver = v; break } }
    if (!ver) return null
    const vi = VER[ver - 1]
    const sz = 17 + 4 * ver
    const bits = []
    const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1) }
    push(0x4, 4); push(bytes.length, 8)
    for (const b of bytes) push(b, 8)
    const cap = vi.data * 8
    for (let i = 0; i < Math.min(4, cap - bits.length); i++) bits.push(0)
    while (bits.length & 7) bits.push(0)
    const data = new Uint8Array(vi.data)
    for (let i = 0; i < bits.length; i++) if (bits[i]) data[i >> 3] |= 1 << (7 - (i & 7))
    const pads = [0xEC, 0x11]
    for (let i = bits.length >> 3, p = 0; i < vi.data; i++, p++) data[i] = pads[p & 1]
    const bd = vi.data / vi.blk
    const ecs = []

function deriveSubTheme(style, pal) {
  if (style === 0) return [SUB_THEMES.mint, SUB_THEMES.lavender, SUB_THEMES.cream, SUB_THEMES.terra][pal] || SUB_THEMES.mint
  if (style === 1) return [SUB_THEMES.cream, SUB_THEMES.terra, SUB_THEMES.mint][pal] || SUB_THEMES.cream
  if (style === 2) return [SUB_THEMES.lavender, SUB_THEMES.mint, SUB_THEMES.amber, SUB_THEMES.sky][pal] || SUB_THEMES.lavender
  if (style === 3) return SUB_THEMES.sky
  return pal === 1 ? SUB_THEMES.amber : SUB_THEMES.crt
}

  const p = state.profile
  if (p.avatar_mode === 2 && state.hasPhoto) return `/api/photo.png?v=${p.photo_ver}_${state.photoNonce}`
  const av = state.meta.builtinAvatars[p.avatar_preset] || state.meta.builtinAvatars[0]
  return av.src
}

function statusKind() {
  const s = state.profile.statuses[state.profile.status] || ''
  if (s.includes('下班') || s.includes('休')) return 5

  if (s.includes('会')) return 3
  if (s.includes('摸')) return 2
  if (s.includes('聊') || s.includes('答')) return 1
  if (s.includes('在')) return 0
  return state.profile.status % 6
}

// ---- 1:1 Device Screen Renderers ----
function renderQrSvg(url, rounded, spot, badge) {
  const qr = QR.encode(url)
  if (!qr) return `<div style="font-size:12px;color:#E8432A;text-align:center;padding-top:60px">链接过长</div>`
  const sz = qr.size
  const sc = Math.floor(150 / sz)
  const pad = Math.floor((150 - sz * sc) / 2)
  const inF = (x, y) => (x < 7 && y < 7) || (x >= sz - 7 && y < 7) || (x < 7 && y >= sz - 7)
  const lo = Math.floor(sz / 2) - 2, hi = Math.floor(sz / 2) + 2
  const eye = (ex, ey) => {
    const o = 7 * sc, i1 = 5 * sc, c = 3 * sc
    const ro = rounded ? 6 : 0, ri = rounded ? 3 : 0
    return `<rect x="${ex}" y="${ey}" width="${o}" height="${o}" rx="${ro}" fill="#000"/><rect x="${ex+sc}" y="${ey+sc}" width="${i1}" height="${i1}" rx="${ri}" fill="#FFF"/><rect x="${ex+2*sc}" y="${ey+2*sc}" width="${c}" height="${c}" rx="${ri}" fill="#000"/>`
  }
  let rects = eye(pad, pad) + eye(pad + (sz - 7) * sc, pad) + eye(pad, pad + (sz - 7) * sc)
  const dr = rounded && sc >= 6 ? 1 : 0
  for (let y = 0; y < sz; y++) {
    for (let x = 0; x < sz; x++) {
      if (!qr.modules[y * sz + x] || inF(x, y)) continue
      if (rounded && x >= lo && x <= hi && y >= lo && y <= hi) continue
      rects += `<rect x="${pad + x * sc}" y="${pad + y * sc}" width="${sc}" height="${sc}" rx="${dr}" fill="#000"/>`
    }
  }
  const mid = rounded ? `<div style="position:absolute;left:61px;top:61px;width:28px;height:28px;background:#FFF;border-radius:5px;display:flex;align-items:center;justify-content:center"><div style="width:22px;height:22px;border-radius:4px;background:${spot};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#FFF">${esc(badge)}</div></div>` : ''
  return `<div style="width:150px;height:150px;position:relative;background:#FFF"><svg viewBox="0 0 150 150" width="150" height="150" shape-rendering="crispEdges" style="display:block"><rect width="150" height="150" fill="#FFF"/>${rects}</svg>${mid}</div>`
}

          <div style="display:flex;gap:4px;flex-shrink:0">${pager}</div>
        </div>
      </div>`
    }
    return
  }

  // ---- Memo Preview (Scheme A: Undone Starred -> Undone Regular -> Done Sunk to Bottom) ----
  const rawMemos = p.memos || []
  const memos = [
    ...rawMemos.filter((m) => !m.done && m.star),
    ...rawMemos.filter((m) => !m.done && !m.star),
    ...rawMemos.filter((m) => m.done),
  ]
  const total = memos.length
  const doneCount = memos.filter((m) => m.done).length
  const firstUndone = memos.findIndex((m) => !m.done)
  const vis = memos.slice(0, 4)
  const hiddenMore = memos.slice(vis.length).filter((m) => !m.done).length
  const allDone = total > 0 && doneCount >= total
  const foot = allDone ? (isWork ? '今日全部清空' : 'MEMO') : (hiddenMore > 0 ? `↓ 还有 ${hiddenMore} 条` : '短按切换')

  const starSvg = (done) => `<svg viewBox="0 0 14 14" width="13" height="13" style="display:inline-block;vertical-align:-2px;margin-right:3px"><path d="M7 1 L8.8 4.8 L12.9 5.3 L9.8 8.1 L10.6 12.2 L7 10.2 L3.4 12.2 L4.2 8.1 L1.1 5.3 L5.2 4.8 Z" fill="${done?'#C99E8C':'#F04E23'}"/></svg>`

  if (isWork) {
    const wk = sub.wk
    const pct = total ? Math.round((doneCount / total) * 100) : 0
    const rows = vis.map((m, li) => {
      const next = li === firstUndone
      return `<div style="height:54px;padding:6px 14px;border-bottom:1px solid ${wk.rule};background:${next?wk.active:'transparent'};display:flex;align-items:center;gap:8px;position:relative">
        ${next?`<div style="position:absolute;left:0;top:5px;bottom:5px;width:4px;background:${wk.spot};border-radius:0 2px 2px 0"></div>`:''}
        <div style="width:16px;height:16px;border-radius:4px;border:1.8px solid ${m.done||next?wk.spot:'#698C7E'};background:${m.done?wk.spot:'#FFF'};display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#FFF;font-size:11px;font-weight:900">${m.done?'✓':''}</div>
        <span style="flex:1;font-size:14px;font-weight:600;line-height:18px;color:${m.done?'#7E9A8F':wk.ink};text-decoration:${m.done?'line-through':'none'};text-decoration-color:${wk.spot};text-decoration-thickness:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${m.star?starSvg(m.done):''}${esc(m.text)}</span>
      </div>`
    }).join('')
    scr.innerHTML = `<div style="width:240px;height:320px;background:${wk.paper};color:${wk.ink};display:flex;flex-direction:column">
      <div style="height:54px;background:${wk.headBg};border-bottom:1.5px solid ${wk.headBd};padding:15px 20px 8px;display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px"><span style="width:6px;height:16px;border-radius:3px;background:${wk.spot}"></span><span style="font-size:18px;font-weight:600">待办</span></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span style="font-family:Menlo,monospace;font-size:11px;font-weight:700;color:${wk.spot}">${doneCount}/${total}</span><div style="width:48px;height:4px;border-radius:99px;background:${wk.barOff};overflow:hidden"><div style="width:${pct}%;height:100%;background:${wk.spot}"></div></div></div>
      </div>
      ${total ? `<div style="flex:1;display:flex;flex-direction:column;padding-bottom:14px">${rows}<div style="margin-top:auto;padding:6px 20px 2px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;font-weight:600;color:${wk.muted}">${foot}</span><span style="padding:2px 7px;background:${wk.keyBg};border-radius:99px;font-size:11px;font-weight:700;color:${wk.spot}">${allDone?'ALL DONE':'长按 ✓'}</span></div></div>`
        : `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><span style="font-size:18px;font-weight:600">今日暂无待办</span></div>`}
    </div>`
  } else {
    const stu = sub.stu
    const rows = vis.map((m, li) => {
      const next = li === firstUndone
      return `<div style="height:49px;padding:5px 8px;border-radius:10px;background:${next?stu.hl:(m.done?'rgba(255,255,255,0.45)':'rgba(255,255,255,0.9)')};border:${next?'2px solid #141414':'1.5px solid rgba(20,20,20,0.22)'};box-shadow:${next?'2px 2px 0 #141414':'none'};display:flex;align-items:center;gap:8px">
        <div style="width:17px;height:17px;border-radius:50%;border:2px solid #141414;background:${m.done?'#141414':'#FFF'};color:${stu.chk};font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0">${m.done?'✓':''}</div>
        <span style="flex:1;font-size:14px;font-weight:600;line-height:18px;color:${m.done?'#8B8370':'#141414'};text-decoration:${m.done?'line-through':'none'};text-decoration-color:${stu.spot};text-decoration-thickness:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${m.star?starSvg(m.done):''}${esc(m.text)}</span>
      </div>`
    }).join('')
    scr.innerHTML = `<div style="width:240px;height:320px;background-color:${stu.paper};background-image:linear-gradient(to right,${stu.grid} 1px,transparent 1px),linear-gradient(to bottom,${stu.grid} 1px,transparent 1px);background-size:16px 16px;padding:14px 14px 15px;display:flex;flex-direction:column;position:relative;color:#141414">
      <div style="position:absolute;left:76px;top:6px;width:88px;height:12px;background:${stu.tape};border:1.5px solid #141414;transform:rotate(-1.5deg)"></div>
      <div style="margin-top:8px;padding:0 4px 8px;border-bottom:2px solid #141414;display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2.5 2 H13.5 V10.5 L10 14 H2.5 Z" fill="${stu.note}" stroke="#141414" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 14 V10.5 H13.5" fill="none" stroke="#141414" stroke-width="1.5"/><line x1="5" y1="5.5" x2="11" y2="5.5" stroke="#141414" stroke-width="1.5"/><line x1="5" y1="8.5" x2="9" y2="8.5" stroke="#141414" stroke-width="1.5"/></svg>
          <span style="font-size:18px;font-weight:600">今日清单</span>
        </div>
        <div style="background:${stu.pillBg};color:#FFF;border:1.8px solid #141414;border-radius:99px;padding:2px 8px;box-shadow:2px 2px 0 #141414;font-family:Menlo,monospace;font-size:11px;font-weight:700">${doneCount}/${total}</div>
      </div>
      ${total ? `<div style="flex:1;display:flex;flex-direction:column;gap:5px;padding:8px 0 4px">${rows}</div>
        <div style="margin-top:auto;padding:3px 6px 0;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:${allDone?11:13}px;font-weight:${allDone?700:600};color:${stu.muted}">${foot}</span>
          <span style="background:${allDone?stu.spot:stu.hl};color:${allDone?'#FFF':'#141414'};border:1.5px solid #141414;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700">${allDone?'搞定啦 ✓':'长按 ✓'}</span>
        </div>`
        : `<div style="flex:1;display:flex;align-items:center;justify-content:center"><span style="background:${stu.hl};border:2px solid #141414;border-radius:12px;padding:8px 14px;box-shadow:3px 3px 0 #141414;font-size:18px;font-weight:600">今天空空的</span></div>`}
    </div>`
  }
}

// ---- Render Editors ----
function renderEditors() {
  const p = state.profile
  const meta = state.meta
  const st = meta.styles[p.style]

  // Tabs
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === state.tab))
  $('panelBadge').classList.toggle('hidden', state.tab !== 'badge')
  $('panelSub').classList.toggle('hidden', state.tab !== 'sub')
  $('pvSwitch').classList.toggle('hidden', state.tab !== 'sub')
  document.querySelectorAll('#pvSwitch button').forEach((b) => b.classList.toggle('on', b.dataset.pv === state.pvTab))

  // Pairing banner (only if a badge requests pairing)
  if (state.pairing.length) {
    $('pairBar').classList.add('show')
    $('pairText').textContent = `新工牌配对码 ${state.pairing[0].code}`
  } else {
    $('pairBar').classList.remove('show')
  }

  // Style cards
  $('styleGrid').innerHTML = meta.styles.map((s) => `
    <button type="button" class="style-btn ${s.id === p.style ? 'on' : ''}" data-style="${s.id}">
      <div class="style-thumb" style="background:${s.thumbBg}">
        <span style="width:14px;height:14px;border-radius:4px;background:${s.thumbA}"></span>
        <span style="width:24px;height:8px;border-radius:3px;background:${s.thumbB}"></span>
      </div>
      <span class="style-name">${esc(s.name)}</span>
    </button>
  `).join('')

  // Palettes
  if (st.palettes.length > 1) {
    $('palRow').classList.remove('hidden')
    $('palRow').innerHTML = `<span class="pal-lbl">配色</span>` + st.palettes.map((pl, i) => `
      <button type="button" class="pal-btn ${i === p.palette_idx ? 'on' : ''}" data-pal="${i}">
        <span class="swatch" style="background:${pl.swatch}"></span>
        <span>${esc(pl.name)}</span>
      </button>
    `).join('')
  } else {
    $('palRow').classList.add('hidden')
  }

  // Avatars
  const isPxStyle = p.style === 3
  $('avTabPreset').classList.toggle('on', state.avTab === 'preset')
  $('avTabUpload').classList.toggle('on', state.avTab === 'upload')
  $('avPresetBox').classList.toggle('hidden', state.avTab !== 'preset')
  $('avUploadBox').classList.toggle('hidden', state.avTab !== 'upload')
  if (state.avTab === 'preset') {
    if (isPxStyle) {
      $('avPresetBox').innerHTML = `<div class="px-grid">` + meta.pixelSprites.map((sp) => `
        <button type="button" class="av-btn ${p.avatar_mode === 0 && p.pixel_preset === sp.id ? 'on' : ''}" data-px="${sp.id}">
          <div class="av-stage" style="background:#264882;align-items:center"><svg viewBox="0 0 24 24" width="54" height="54" shape-rendering="crispEdges">${PIXEL_SVG[sp.id]}</svg></div>
          <span class="av-name">${esc(sp.name)}</span>
        </button>
      `).join('') + `</div>`
    } else {
      const crtFilter = p.style === 4 ? (st.palettes[p.palette_idx]?.filter || '') : ''
      $('avPresetBox').innerHTML = `<div class="av-grid">` + meta.builtinAvatars.map((av) => `
        <button type="button" class="av-btn ${p.avatar_mode === 0 && p.avatar_preset === av.id ? 'on' : ''}" data-av="${av.id}">
          <div class="av-stage" style="background:${p.style===4?'#08120B':av.stage}"><img src="${av.src}" alt="${esc(av.name)}" style="filter:${crtFilter}"></div>
          <span class="av-name">${esc(av.name)}</span>
        </button>
      `).join('') + `</div>`
    }
  } else {
    $('uploadPrevImg').src = avatarSrc()
    $('uploadPrevImg').style.filter = p.style === 4 ? (st.palettes[p.palette_idx]?.filter || '') : ''
  }

  // Form inputs (avoid overwriting active typing cursor)
  const setVal = (id, v) => { const el = $(id); if (document.activeElement !== el) el.value = v ?? '' }
  setVal('inName', p.name)
  setVal('inHandle', p.handle)
  setVal('inTitle', p.title)
  setVal('inTagline', p.tagline)
  setVal('inEmp', p.emp_id)
  setVal('inPassTag', p.pass_tag)
  $('cntName').textContent = `${Math.ceil(cols(p.name)/2)}/4`
  $('cntHandle').textContent = `${p.handle.length}/10`
  $('cntTitle').textContent = `${Math.ceil(cols(p.title)/2)}/6`
  $('cntTagline').textContent = `${Math.ceil(cols(p.tagline)/2)}/9`
  $('inMbti').value = p.mbti || ''
  $('fieldEmp').classList.toggle('hidden', p.style === 1)
  $('fieldPassTag').classList.toggle('hidden', p.style !== 2)

  // Bottom status / mood chips
  if (st.hasStatus) {
    $('statusMoodRow').classList.remove('hidden')
    const colors = meta.statusColors
    $('statusMoodRow').innerHTML = `<span class="pal-lbl">状态</span>` + p.statuses.map((s, i) => `
      <button type="button" class="chip ${i === p.status ? 'on' : ''}" data-status="${i}">
        <span class="chip-dot" style="background:${colors[i % colors.length]}"></span>${esc(s)}
      </button>
    `).join('')
  } else if (st.hasMood) {
    $('statusMoodRow').classList.remove('hidden')
    $('statusMoodRow').innerHTML = `<span class="pal-lbl">心情</span>` + meta.moods.map((m) => `
      <button type="button" class="chip ${m.id === p.mood_idx ? 'on' : ''}" data-mood="${m.id}">
        <span class="chip-dot" style="background:${m.bg}"></span>${esc(m.text)}
      </button>
    `).join('')
  } else {
    $('statusMoodRow').classList.add('hidden')
  }

  // Sub-page controls
  $('sceneWork').className = p.sub_scene === 0 ? 'on-lime' : ''
  $('sceneStu').className = p.sub_scene === 1 ? 'on-lime' : ''
  $('qrRound').className = p.qr_rounded ? 'on' : ''
  $('qrSharp').className = !p.qr_rounded ? 'on' : ''

  // QR slots
  const qrs = p.qrs || []
  $('qrList').innerHTML = qrs.map((q, i) => {
    const ch = meta.qrChannels[q.channel] || meta.qrChannels[5]
    const opts = meta.qrChannels.map((c) => `<option value="${c.id}" ${c.id === q.channel ? 'selected' : ''}>${esc(c.name)}</option>`).join('')
    return `<div class="qr-row ${i === p.qr_idx ? 'on' : ''}" data-qr-pick="${i}">
      <span class="qr-badge" style="background:${ch.spot}">${esc(ch.badge)}</span>
      <select data-qr-ch="${i}">${opts}</select>
      <input data-qr-lbl="${i}" value="${esc(q.label)}" maxlength="16" placeholder="底部说明">
      <button type="button" class="qr-del" data-qr-del="${i}" aria-label="删除">×</button>
    </div>`
  }).join('')

  // Memo rows (max 10, max 3 stars)
  const memos = p.memos || []
  const starCnt = memos.filter((m) => m.star).length
  const starFull = starCnt >= 3
  const firstUndone = memos.findIndex((m) => !m.done)
  $('memoMeta').textContent = `${memos.length}/10 · ★ ${starCnt}/3`
  $('memoList').innerHTML = memos.map((m, i) => `
    <div class="memo-row ${i === firstUndone ? 'focus' : ''}">
      <button type="button" class="memo-chk ${m.done ? 'done' : ''}" data-m-done="${i}">${m.done ? '✓' : ''}</button>
      <span class="memo-txt ${m.done ? 'done' : ''}">${esc(m.text)}</span>
      <button type="button" class="memo-mv" data-m-up="${i}" title="上移">↑</button>
      <button type="button" class="memo-mv" data-m-dn="${i}" title="下移">↓</button>
      <button type="button" class="memo-star ${m.star ? 'on' : (starFull ? 'full' : '')}" data-m-star="${i}" aria-label="重要星标">★</button>
      <button type="button" class="memo-del" data-m-del="${i}" aria-label="删除">×</button>
    </div>
  `).join('')

  renderScreen()
}

function mutate(fn) {
  fn(state.profile)
  setDirty(true)
  renderEditors()
}

async function syncToBadge() {
  const btn = $('syncBtn')
  btn.disabled = true
  try {
    const r = await fetch('/api/profile', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state.profile),
    })
    const d = await r.json()
    if (!r.ok) throw new Error(d.detail || '同步失败')
    state.profile = d.profile
    state.hasPhoto = d.hasPhoto
    state.pairing = d.pairing || []
    setDirty(false)
    renderEditors()
    showToast('已同步到工牌')
  } catch (e) {
    showToast(e.message, true)
  } finally {
    btn.disabled = false
  }
}

async function handlePhotoFile(file) {
  if (!file) return
  $('photoDropText').textContent = '抠图处理中…'
  const reader = new FileReader()
  reader.onload = async () => {
    try {
      const r = await fetch('/api/photo/cutout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: reader.result }),
      })
      const d = await r.json()
      if (!r.ok) throw new Error(d.detail || '图片处理失败')
      state.profile.avatar_mode = 2
      state.profile.photo_ver = d.profile.photo_ver
      state.hasPhoto = d.hasPhoto
      state.photoNonce++
      setDirty(true)
      renderEditors()
      showToast('抠图完成，点击同步到工牌')
    } catch (e) {
      showToast(e.message, true)
    } finally {
      $('photoDropText').textContent = '拖入图片或点击上传'
    }
  }
  reader.readAsDataURL(file)
}

async function handleQrFile(file) {
  if (!file) return
  if (state.profile.qrs.length >= 3) return showToast('最多支持 3 张名片码', true)
  const reader = new FileReader()
  reader.onload = async () => {
    try {
      const r = await fetch('/api/qr/decode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: reader.result }),
      })
      const d = await r.json()
      if (!r.ok) throw new Error(d.detail || '二维码识别失败')
      const url = d.url
      const chIdx = url.includes('work.weixin') ? 0 : (url.includes('wechat.com') ? 1 : (url.includes('xhs') ? 2 : 3))
      const ch = state.meta.qrChannels[chIdx]
      mutate((p) => {
        p.qrs.push({ url, channel: chIdx, label: ch.caption })
        p.qr_idx = p.qrs.length - 1
      })
      state.pvTab = 'qr'
      renderEditors()
      showToast('已识别二维码，可先扫码核对')
    } catch (e) {
      showToast(e.message, true)
    }
  }
  reader.readAsDataURL(file)
}

function sortMemos(list) {
  return [
    ...list.filter((x) => !x.done && x.star),
    ...list.filter((x) => !x.done && !x.star),
    ...list.filter((x) => x.done),
  ]
}

function addMemoFromInput() {
  const inp = $('memoInput')
  const t = inp.value.trim()
  if (!t) return
  if (state.profile.memos.length >= 10) return showToast('最多保存 10 条待办', true)
  mutate((p) => { p.memos = sortMemos([...p.memos, { text: t, done: false, star: false }]) })
  inp.value = ''
  state.pvTab = 'memo'
  renderEditors()
}

$('inPassTag').addEventListener('input', (e) => mutate((p) => { p.pass_tag = e.target.value.toUpperCase().replace(/[^A-Z0-9 /]/g, '').slice(0, 12) }))

$('statusMoodRow').addEventListener('click', (e) => {
  const s = e.target.closest('[data-status]')
  if (s) return mutate((p) => { p.status = Number(s.dataset.status) })
  const m = e.target.closest('[data-mood]')
  if (m) return mutate((p) => { p.mood_idx = Number(m.dataset.mood) })
})

$('sceneWork').addEventListener('click', () => mutate((p) => { p.sub_scene = 0 }))
$('sceneStu').addEventListener('click', () => mutate((p) => { p.sub_scene = 1 }))
$('qrRound').addEventListener('click', () => { state.pvTab = 'qr'; mutate((p) => { p.qr_rounded = true }) })
$('qrSharp').addEventListener('click', () => { state.pvTab = 'qr'; mutate((p) => { p.qr_rounded = false }) })
$('uploadQrBtn').addEventListener('click', () => $('qrFile').click())
$('qrFile').addEventListener('change', (e) => { handleQrFile(e.target.files[0]); e.target.value = '' })
$('addQrManual').addEventListener('click', () => {
  if (state.profile.qrs.length >= 3) return showToast('最多支持 3 张名片码', true)
  const url = prompt('粘贴名片短链（≤80 字符）', 'https://u.wechat.com/')
  if (!url || !url.trim()) return
  const chIdx = url.includes('work.weixin') ? 0 : (url.includes('wechat.com') ? 1 : 3)
  const ch = state.meta.qrChannels[chIdx]
  state.pvTab = 'qr'
  mutate((p) => { p.qrs.push({ url: url.trim().slice(0, 80), channel: chIdx, label: ch.caption }); p.qr_idx = p.qrs.length - 1 })
})

$('qrList').addEventListener('click', (e) => {
  const del = e.target.closest('[data-qr-del]')
  if (del) {
    const i = Number(del.dataset.qrDel)
    return mutate((p) => { p.qrs.splice(i, 1); p.qr_idx = Math.max(0, Math.min(p.qr_idx, p.qrs.length - 1)) })
  }
  const row = e.target.closest('[data-qr-pick]')
  if (row && !e.target.matches('select,input')) {
    state.pvTab = 'qr'
    state.profile.qr_idx = Number(row.dataset.qrPick)
    renderEditors()
  }
})
$('qrList').addEventListener('change', (e) => {
  if (e.target.dataset.qrCh !== undefined) {
    const i = Number(e.target.dataset.qrCh)
    const ch = Number(e.target.value)
    mutate((p) => { p.qrs[i].channel = ch; p.qrs[i].label = state.meta.qrChannels[ch].caption })
  }
})
$('qrList').addEventListener('input', (e) => {
  if (e.target.dataset.qrLbl !== undefined) {
    const i = Number(e.target.dataset.qrLbl)
    mutate((p) => { p.qrs[i].label = e.target.value })
  }
})

$('memoAddBtn').addEventListener('click', addMemoFromInput)
$('memoInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') addMemoFromInput() })
$('memoList').addEventListener('click', (e) => {
  const done = e.target.closest('[data-m-done]')
  if (done) {
    const i = Number(done.dataset.mDone)
    state.pvTab = 'memo'
    return mutate((p) => {
      p.memos[i].done = !p.memos[i].done
      p.memos = sortMemos(p.memos)
    })
  }
  const star = e.target.closest('[data-m-star]')
  if (star) {
    const i = Number(star.dataset.mStar)
    const m = state.profile.memos[i]
    const cnt = state.profile.memos.filter((x) => x.star).length
    if (!m.star && cnt >= 3) return showToast('星标最多允许标 3 个', true)
    state.pvTab = 'memo'
    return mutate((p) => {
      p.memos[i].star = !p.memos[i].star
      p.memos = sortMemos(p.memos)
    })
  }
  const up = e.target.closest('[data-m-up]')
  if (up) {
    const i = Number(up.dataset.mUp)
    if (i > 0) mutate((p) => { [p.memos[i-1], p.memos[i]] = [p.memos[i], p.memos[i-1]] })
    return
  }
  const dn = e.target.closest('[data-m-dn]')
  if (dn) {
    const i = Number(dn.dataset.mDn)
    if (i < state.profile.memos.length - 1) mutate((p) => { [p.memos[i+1], p.memos[i]] = [p.memos[i], p.memos[i+1]] })
    return
  }
  const del = e.target.closest('[data-m-del]')
  if (del) {
    const i = Number(del.dataset.mDel)
    state.pvTab = 'memo'
    return mutate((p) => { p.memos.splice(i, 1) })
  }
})

// ---- Init ----
async function init() {
  const [metaR, profR] = await Promise.all([fetch('/api/meta'), fetch('/api/profile')])
  state.meta = await metaR.json()
  const snap = await profR.json()
  state.profile = snap.profile
  state.profile.memos = sortMemos(state.profile.memos || [])
  state.hasPhoto = snap.hasPhoto
  state.pairing = snap.pairing || []
  state.avTab = state.profile.avatar_mode === 2 ? 'upload' : 'preset'

  $('inMbti').innerHTML = `<option value="">不展示</option>` +
    state.meta.mbtiOptions.map((m) => `<option value="${m}">${m}</option>`).join('')
  setDirty(false)
  renderEditors()
}
init()
</script>
</body>
</html>
